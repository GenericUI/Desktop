<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GenericUI 6-Platform Continuous UI Icon (Top: macOS, Linux GTK, Windows | Bottom: iOS, Web, Android)">
  <defs>
    <!-- Diagonal Cut 1: (224, 0) -> (112, 512) (at y=256, x=168) -->
    <!-- Diagonal Cut 2: (368, 0) -> (256, 512) (at y=256, x=312) -->
    <!-- Horizontal Split: y = 256 (Top Half: Desktop | Bottom Half: Mobile & Web) -->

    <!-- TOP HALF CLIPS: macOS (Left), Linux GTK4 (Center), Windows 11 (Right) -->
    <clipPath id="macTopClip">
      <polygon points="0,0 224,0 168,256 0,256"/>
    </clipPath>
    <clipPath id="gtkTopClip">
      <polygon points="224,0 368,0 312,256 168,256"/>
    </clipPath>
    <clipPath id="winTopClip">
      <polygon points="368,0 512,0 512,256 312,256"/>
    </clipPath>

    <!-- BOTTOM HALF CLIPS: iOS (Left), Web (Center), Android (Right) -->
    <clipPath id="iosBottomClip">
      <polygon points="0,256 168,256 112,512 0,512"/>
    </clipPath>
    <clipPath id="webBottomClip">
      <polygon points="168,256 312,256 256,512 112,512"/>
    </clipPath>
    <clipPath id="androidBottomClip">
      <polygon points="312,256 512,256 512,512 256,512"/>
    </clipPath>

    <!-- Header Gradients -->
    <linearGradient id="macHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#383942"/>
      <stop offset="100%" stop-color="#272830"/>
    </linearGradient>
    <linearGradient id="gtkHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#303030"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="winHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23"/>
      <stop offset="100%" stop-color="#12141A"/>
    </linearGradient>
  </defs>

  <!-- Solid Opaque Fallback Base (Zero Transparency) -->
  <rect x="0" y="0" width="512" height="512" fill="#181920"/>

  <!-- ========================================================================= -->
  <!-- TOP-LEFT: MODERN macOS (Traffic Lights, NO In-Window MenuBar)             -->
  <!-- ========================================================================= -->
  <g clip-path="url(#macTopClip)">
    <rect x="0" y="0" width="512" height="256" fill="#1C1D24"/>

    <!-- Continuous TitleBar (y = 0..52) — macOS Unified TitleBar (No MenuBar below) -->
    <rect x="0" y="0" width="512" height="52" fill="url(#macHeaderGrad)"/>
    <line x1="0" y1="52" x2="512" y2="52" stroke="#000000" stroke-opacity="0.65" stroke-width="1.5"/>

    <!-- Set 1: macOS Traffic Light Close / Minimize / Maximize Circle Buttons -->
    <circle cx="34" cy="26" r="11" fill="#FF5F56" stroke="#E0443E" stroke-width="1.5"/>
    <path d="M29.5 21.5 L38.5 30.5 M38.5 21.5 L29.5 30.5" stroke="#4D0000" stroke-width="2" stroke-linecap="round"/>
    <circle cx="68" cy="26" r="11" fill="#FFBD2E" stroke="#DEA123" stroke-width="1.5"/>
    <line x1="63" y1="26" x2="73" y2="26" stroke="#5A3000" stroke-width="2" stroke-linecap="round"/>
    <circle cx="102" cy="26" r="11" fill="#27C93F" stroke="#1AAB29" stroke-width="1.5"/>
    <path d="M97 26 L107 26 M102 21 L102 31" stroke="#003D00" stroke-width="2" stroke-linecap="round"/>

    <!-- Continuous TitleBar Segmented Control (x = 144..348, y = 11..41) -->
    <rect x="144" y="11" width="204" height="30" rx="8" fill="#1B1C22" stroke="#484852" stroke-width="1.5"/>
    <rect x="148" y="14" width="96" height="24" rx="6" fill="#0A84FF"/>
    <rect x="168" y="22" width="56" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="268" y="22" width="56" height="8" rx="4" fill="#98989D"/>

    <!-- Continuous Row 1: Search & Action Bar (x = 24..488, y = 90..134) -->
    <rect x="24" y="90" width="464" height="44" rx="14" fill="#262731" stroke="#3A3B47" stroke-width="1.5"/>
    <rect x="38" y="99" width="276" height="26" rx="13" fill="#16171E" stroke="#454654" stroke-width="1.5"/>
    <circle cx="56" cy="112" r="5.5" fill="none" stroke="#0A84FF" stroke-width="2"/>
    <line x1="60.5" y1="116.5" x2="65" y2="121" stroke="#0A84FF" stroke-width="2" stroke-linecap="round"/>
    <rect x="76" y="107" width="200" height="10" rx="5" fill="#EBEBF5" opacity="0.85"/>
    <rect x="328" y="99" width="146" height="26" rx="13" fill="#0A84FF"/>
    <rect x="358" y="107" width="86" height="10" rx="5" fill="#FFFFFF"/>

    <!-- Continuous Row 2: Tree-Grid & Inspector Table Card (x = 24..488, y = 144..244) -->
    <rect x="24" y="144" width="464" height="100" rx="14" fill="#23242E" stroke="#3A3B47" stroke-width="1.5"/>
    <!-- Tree Row A (Selected Pill in macOS Blue #0A84FF) -->
    <rect x="34" y="153" width="444" height="38" rx="10" fill="#0A84FF"/>
    <path d="M48 168 L58 168 L53 177 Z" fill="#FFFFFF"/>
    <rect x="68" y="166" width="140" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="224" y="162" width="150" height="20" rx="6" fill="#0060DF"/>
    <!-- Tree Row B (Indented Leaf Row) -->
    <line x1="53" y1="191" x2="53" y2="218" stroke="#64D2FF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="53" y1="218" x2="70" y2="218" stroke="#64D2FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="78" cy="218" r="5" fill="#64D2FF"/>
    <rect x="92" y="212" width="116" height="12" rx="6" fill="#AEAEB2"/>
    <rect x="224" y="208" width="150" height="20" rx="10" fill="#16171E" stroke="#454654" stroke-width="1.5"/>
  </g>

  <!-- ========================================================================= -->
  <!-- TOP-CENTER: LINUX GTK4 / LIBADWAITA (With In-Window GTK MenuBar)          -->
  <!-- ========================================================================= -->
  <g clip-path="url(#gtkTopClip)">
    <rect x="0" y="0" width="512" height="256" fill="#242424"/>

    <!-- Continuous TitleBar (y = 0..52) — Linux Compositor Server-Side TitleBar (No custom widgets) -->
    <rect x="0" y="0" width="512" height="52" fill="url(#gtkHeaderGrad)"/>
    <line x1="0" y1="52" x2="512" y2="52" stroke="#181818" stroke-width="1.5"/>

    <!-- Linux GTK4 In-Window MenuBar (y = 52..82, absent on macOS) -->
    <rect x="0" y="52" width="512" height="30" fill="#2B2B2B"/>
    <line x1="0" y1="82" x2="512" y2="82" stroke="#181818" stroke-width="1.5"/>
    <!-- GTK MenuBar Items (File, Edit, View, Tools) -->
    <rect x="206" y="57" width="44" height="20" rx="5" fill="#3584E4" opacity="0.35"/>
    <rect x="214" y="64" width="28" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="260" y="64" width="32" height="6" rx="3" fill="#DEDDDA"/>
    <rect x="304" y="64" width="34" height="6" rx="3" fill="#DEDDDA"/>
    <rect x="350" y="64" width="36" height="6" rx="3" fill="#DEDDDA"/>

    <!-- Continuous Row 1: Search & Action Bar (x = 24..488, y = 90..134) -->
    <rect x="24" y="90" width="464" height="44" rx="10" fill="#303030" stroke="#424242" stroke-width="1.5"/>
    <rect x="38" y="99" width="276" height="26" rx="8" fill="#1E1E1E" stroke="#4F4F4F" stroke-width="1.5"/>
    <rect x="76" y="107" width="200" height="10" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="328" y="99" width="146" height="26" rx="8" fill="#3584E4"/>
    <rect x="358" y="107" width="86" height="10" rx="4" fill="#FFFFFF"/>

    <!-- Continuous Row 2: Tree-Grid & Inspector Table Card (x = 24..488, y = 144..244) — Adwaita .boxed-list -->
    <rect x="24" y="144" width="464" height="100" rx="12" fill="#303030" stroke="#454545" stroke-width="1.5"/>
    <line x1="24" y1="195" x2="488" y2="195" stroke="#242424" stroke-width="2"/>
    <!-- Tree Row A -->
    <rect x="34" y="153" width="444" height="38" rx="8" fill="#3584E4" opacity="0.25" stroke="#3584E4" stroke-width="1.5"/>
    <rect x="68" y="166" width="140" height="12" rx="4" fill="#FFFFFF"/>
    <rect x="224" y="160" width="150" height="24" rx="6" fill="#1E1E1E" stroke="#5E5C64" stroke-width="1.5"/>
    <rect x="236" y="168" width="96" height="8" rx="4" fill="#33D17A"/>
    <!-- Tree Row B -->
    <rect x="92" y="212" width="116" height="12" rx="4" fill="#DEDDDA"/>
    <rect x="224" y="206" width="150" height="24" rx="6" fill="#1E1E1E" stroke="#5E5C64" stroke-width="1.5"/>
    <rect x="236" y="214" width="110" height="8" rx="4" fill="#62A0EA"/>
  </g>

  <!-- ========================================================================= -->
  <!-- TOP-RIGHT: MODERN WINDOWS 11 (Caption Buttons + In-Window Win32 MenuBar)  -->
  <!-- ========================================================================= -->
  <g clip-path="url(#winTopClip)">
    <rect x="0" y="0" width="512" height="256" fill="#191B22"/>

    <!-- Continuous TitleBar (y = 0..52) — Windows 11 Caption Bar -->
    <rect x="0" y="0" width="512" height="52" fill="url(#winHeaderGrad)"/>
    <line x1="0" y1="52" x2="512" y2="52" stroke="#2D313E" stroke-width="1.5"/>

    <!-- Set 2: Windows 11 Minimize / Maximize / Red Close Caption Buttons (Top-Right) -->
    <rect x="368" y="0" width="46" height="52" fill="#232630"/>
    <line x1="384" y1="26" x2="398" y2="26" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="414" y="0" width="48" height="52" fill="#2A2E3B"/>
    <rect x="431" y="19" width="14" height="14" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="462" y="0" width="50" height="52" fill="#C42B1C"/>
    <path d="M480 19 L494 33 M494 19 L480 33" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Windows 11 In-Window MenuBar (y = 52..82, flows directly from GTK MenuBar) -->
    <rect x="0" y="52" width="512" height="30" fill="#1F232E"/>
    <line x1="0" y1="82" x2="512" y2="82" stroke="#2D3343" stroke-width="1.5"/>
    <!-- Win11 MenuBar Items (Tools, Window, Help) -->
    <rect x="350" y="64" width="36" height="6" rx="1.5" fill="#E2E8F0"/>
    <rect x="396" y="57" width="48" height="20" rx="3" fill="#2B3142" stroke="#60CDFF" stroke-width="1"/>
    <rect x="404" y="64" width="32" height="6" rx="1.5" fill="#FFFFFF"/>
    <rect x="454" y="64" width="32" height="6" rx="1.5" fill="#94A3B8"/>

    <!-- Continuous Row 1: Search & Action Bar (x = 24..488, y = 90..134) — Win11 Sharp 4px Radius -->
    <rect x="24" y="90" width="464" height="44" rx="4" fill="#232733" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="38" y="99" width="276" height="26" rx="3" fill="#141720" stroke="#475569" stroke-width="1.5"/>
    <rect x="76" y="107" width="200" height="10" rx="2" fill="#F8FAFC"/>
    <rect x="328" y="99" width="146" height="26" rx="3" fill="#0078D4" stroke="#60CDFF" stroke-width="1.5"/>
    <rect x="358" y="107" width="86" height="10" rx="2" fill="#FFFFFF"/>

    <!-- Continuous Row 2: Tree-Grid & Inspector Table Card (x = 24..488, y = 144..244) — Win11 Fluent Grid -->
    <rect x="24" y="144" width="464" height="100" rx="4" fill="#1F232E" stroke="#334155" stroke-width="1.5"/>
    <line x1="24" y1="195" x2="488" y2="195" stroke="#2D3343" stroke-width="1.5"/>
    <!-- Tree Row A -->
    <rect x="34" y="153" width="444" height="38" rx="3" fill="#1E293B" stroke="#60CDFF" stroke-width="1.5"/>
    <rect x="224" y="160" width="150" height="24" rx="3" fill="#141720" stroke="#475569" stroke-width="1.5"/>
    <rect x="386" y="160" width="40" height="24" rx="3" fill="#2B3142" stroke="#60CDFF" stroke-width="1"/>
    <path d="M401 175 L406 168 L411 175" fill="none" stroke="#60CDFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="432" y="160" width="40" height="24" rx="3" fill="#C42B1C"/>
    <path d="M447 167 L457 177 M457 167 L447 177" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Tree Row B -->
    <rect x="224" y="206" width="150" height="24" rx="3" fill="#141720" stroke="#475569" stroke-width="1.5"/>
    <rect x="386" y="206" width="40" height="24" rx="3" fill="#2B3142" stroke="#475569" stroke-width="1"/>
    <path d="M401 215 L406 222 L411 215" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="432" y="206" width="40" height="24" rx="3" fill="#0078D4"/>
    <path d="M447 218 L457 218 M452 213 L452 223" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM-LEFT: iOS (UIKit / Cupertino Grouped Inset Cards & Home Indicator) -->
  <!-- ========================================================================= -->
  <g clip-path="url(#iosBottomClip)">
    <!-- iOS Dark Grouped Background (#121216) -->
    <rect x="0" y="256" width="512" height="256" fill="#121216"/>

    <!-- Continuous Row 3: Form Controls & Slider Card (x = 24..488, y = 268..372) — iOS Inset Grouped Card -->
    <rect x="24" y="268" width="464" height="104" rx="18" fill="#1C1C22" stroke="#2C2C36" stroke-width="1.5"/>
    <line x1="44" y1="320" x2="468" y2="320" stroke="#2C2C36" stroke-width="1.5"/>
    <!-- Sub-row 3A: Toggle Switch Row (y = 280..310) — iOS Green UISwitch (#34C759) -->
    <rect x="44" y="280" width="52" height="28" rx="14" fill="#34C759"/>
    <circle cx="82" cy="294" r="12" fill="#FFFFFF"/>
    <rect x="110" y="288" width="220" height="12" rx="6" fill="#F2F2F7"/>
    <!-- Sub-row 3B: Continuous Slider Track (x = 44..468, y = 342..350) — iOS UISlider (#007AFF) -->
    <rect x="44" y="342" width="424" height="8" rx="4" fill="#3A3A3C"/>
    <rect x="44" y="342" width="280" height="8" rx="4" fill="#007AFF"/>
    <circle cx="108" cy="346" r="13" fill="#FFFFFF" stroke="#007AFF" stroke-width="2.5"/>

    <!-- Continuous Row 4: Action Buttons & Badges Strip (x = 24..488, y = 384..436) — iOS Cupertino Filled Pill -->
    <rect x="24" y="384" width="464" height="52" rx="16" fill="#1C1C22" stroke="#2C2C36" stroke-width="1.5"/>
    <rect x="38" y="394" width="190" height="32" rx="16" fill="#007AFF"/>
    <rect x="60" y="405" width="90" height="10" rx="5" fill="#FFFFFF"/>

    <!-- Continuous Row 5: Bottom Navigation Bar (x = 24..488, y = 448..500) — iOS UITabBar & Home Indicator -->
    <rect x="24" y="448" width="464" height="52" rx="18" fill="#1C1C24" stroke="#2C2C36" stroke-width="1.5"/>
    <circle cx="66" cy="468" r="8" fill="#0A84FF"/>
    <rect x="48" y="480" width="36" height="6" rx="3" fill="#0A84FF"/>
    <!-- iOS Home Indicator Pill -->
    <rect x="40" y="494" width="110" height="5" rx="2.5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM-CENTER: WEB (HTML5 DOM / Bootstrap 5 Components)                   -->
  <!-- ========================================================================= -->
  <g clip-path="url(#webBottomClip)">
    <!-- Bootstrap 5 Dark Body Background (#181C24) -->
    <rect x="0" y="256" width="512" height="256" fill="#181C24"/>

    <!-- Continuous Row 3: Form Controls & Slider Card (x = 24..488, y = 268..372) — Bootstrap .card -->
    <rect x="24" y="268" width="464" height="104" rx="10" fill="#212529" stroke="#343A40" stroke-width="2"/>
    <line x1="24" y1="320" x2="488" y2="320" stroke="#343A40" stroke-width="1.5"/>
    <!-- Sub-row 3A: Text & Bootstrap .badge.rounded-pill.bg-primary -->
    <rect x="110" y="288" width="220" height="12" rx="4" fill="#F8F9FA"/>
    <rect x="210" y="282" width="84" height="24" rx="12" fill="#0D6EFD"/>
    <rect x="224" y="290" width="56" height="8" rx="4" fill="#FFFFFF"/>
    <!-- Sub-row 3B: Continuous Slider Track (x = 44..468, y = 342..350) — Bootstrap .form-range & .progress -->
    <rect x="44" y="342" width="424" height="10" rx="5" fill="#343A40"/>
    <rect x="44" y="342" width="280" height="10" rx="5" fill="#0D6EFD"/>
    <circle cx="240" cy="347" r="11" fill="#0D6EFD" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Continuous Row 4: Action Buttons & Badges Strip (x = 24..488, y = 384..436) — Bootstrap .btn-group -->
    <rect x="24" y="384" width="464" height="52" rx="10" fill="#212529" stroke="#343A40" stroke-width="2"/>
    <rect x="38" y="394" width="190" height="32" rx="6" fill="#0D6EFD"/>
    <rect x="240" y="394" width="110" height="32" rx="6" fill="#6F42C1"/>
    <rect x="258" y="405" width="74" height="10" rx="4" fill="#FFFFFF"/>

    <!-- Continuous Row 5: Bottom Navigation Bar (x = 24..488, y = 448..500) — Bootstrap .pagination / Web Bar -->
    <rect x="24" y="448" width="464" height="52" rx="10" fill="#212529" stroke="#343A40" stroke-width="2"/>
    <rect x="148" y="460" width="48" height="28" rx="6" fill="#0D6EFD"/>
    <rect x="204" y="460" width="48" height="28" rx="6" fill="#2B3035" stroke="#495057" stroke-width="1.5"/>
    <rect x="260" y="460" width="48" height="28" rx="6" fill="#2B3035" stroke="#495057" stroke-width="1.5"/>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM-RIGHT: ANDROID (Material 3 / Material You Expressive Tonal UI)     -->
  <!-- ========================================================================= -->
  <g clip-path="url(#androidBottomClip)">
    <!-- Android Material 3 Dark Surface (#141218) -->
    <rect x="0" y="256" width="512" height="256" fill="#141218"/>

    <!-- Continuous Row 3: Form Controls & Slider Card (x = 24..488, y = 268..372) — M3 Surface Container -->
    <rect x="24" y="268" width="464" height="104" rx="24" fill="#211F26" stroke="#49454F" stroke-width="1.5"/>
    <line x1="44" y1="320" x2="468" y2="320" stroke="#36343B" stroke-width="1.5"/>
    <!-- Sub-row 3A: Material 3 Switch (#D0BCFF track, #381E72 thumb) -->
    <rect x="396" y="278" width="60" height="32" rx="16" fill="#D0BCFF"/>
    <circle cx="440" cy="294" r="12" fill="#381E72"/>
    <rect x="110" y="288" width="260" height="12" rx="6" fill="#E6E0E9"/>
    <!-- Sub-row 3B: Continuous Slider Track (x = 44..468, y = 342..350) — Material 3 Slider -->
    <rect x="44" y="340" width="424" height="12" rx="6" fill="#49454F"/>
    <rect x="44" y="340" width="330" height="12" rx="6" fill="#D0BCFF"/>
    <!-- M3 Vertical Pill Slider Handle -->
    <rect x="368" y="330" width="12" height="32" rx="6" fill="#D0BCFF" stroke="#141218" stroke-width="2"/>

    <!-- Continuous Row 4: Action Buttons & Squircle FAB (x = 24..488, y = 384..436) — Material 3 -->
    <rect x="24" y="384" width="464" height="52" rx="24" fill="#211F26" stroke="#49454F" stroke-width="1.5"/>
    <rect x="240" y="394" width="176" height="32" rx="16" fill="#4F378B"/>
    <rect x="268" y="405" width="120" height="10" rx="5" fill="#EADDFF"/>
    <!-- Material 3 Squircle FAB -->
    <rect x="430" y="388" width="44" height="44" rx="14" fill="#D0BCFF"/>
    <path d="M444 410 L460 410 M452 402 L452 418" stroke="#381E72" stroke-width="3" stroke-linecap="round"/>

    <!-- Continuous Row 5: Bottom Navigation Bar (x = 24..488, y = 448..500) — Android M3 NavigationBar -->
    <rect x="24" y="448" width="464" height="52" rx="24" fill="#211F26" stroke="#49454F" stroke-width="1.5"/>
    <!-- M3 Active Navigation Pill Indicator -->
    <rect x="328" y="458" width="64" height="24" rx="12" fill="#4F378B"/>
    <circle cx="360" cy="470" r="5" fill="#EADDFF"/>
    <circle cx="432" cy="470" r="6" fill="#CAC4D0"/>
    <!-- Android Gesture Pill Bar -->
    <rect x="280" y="494" width="136" height="4" rx="2" fill="#E6E0E9" opacity="0.8"/>
  </g>
</svg>
